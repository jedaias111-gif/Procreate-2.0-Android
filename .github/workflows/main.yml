name: Compilar LibreCreate APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir y corregir conflicto de nombre
        run: |
          find . -maxdepth 3 -name "*.zip" -exec unzip -o {} \;
          SETTINGS_FILE=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          find "$PROJECT_DIR" -name "*.kt" -exec sed -i 's/backgroundColor/canvasBgColor/g' {} +
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: LibreCreate-Pro-Android-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 30
          
